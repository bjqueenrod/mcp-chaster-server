
version: '3.8'

services:
  chaster-mcp-python:
    build: .
    container_name: chaster-locks-mcp-python
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - CHASTER_API_TOKEN=${CHASTER_API_TOKEN}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network-python
    volumes:
      # Pour le développement, décommenter la ligne suivante
      # - ./:/app:ro

networks:
  mcp-network-python:
    driver: bridge
    name: chaster-mcp-python-network

